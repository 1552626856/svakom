<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>SVAKOM SL278H 控制台</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0b0d12;
    --card: #151922;
    --card2: #1c2230;
    --line: #262e3d;
    --txt: #e6ebf5;
    --dim: #8b96a8;
    --acc: #ff3b6b;
    --acc2: #ff7a9c;
    --ok: #2fe08a;
    --warn: #ffb020;
  }
  body {
    margin: 0; padding: 14px 12px 40px;
    background: radial-gradient(900px 500px at 50% -10%, #1a2030 0%, var(--bg) 60%);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", Roboto, sans-serif;
    min-height: 100vh;
    user-select: none;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 {
    font-size: 19px; font-weight: 700; margin: 4px 0 2px;
    letter-spacing: .3px;
  }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
  .card {
    background: linear-gradient(180deg, var(--card) 0%, var(--card2) 100%);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .row { display: flex; gap: 8px; align-items: center; }
  .btn {
    flex: 1;
    border: 1px solid var(--line);
    background: #1f2634;
    color: var(--txt);
    border-radius: 12px;
    padding: 13px 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .08s, background .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .4; }
  .btn.primary {
    background: linear-gradient(135deg, var(--acc) 0%, var(--acc2) 100%);
    border-color: transparent;
    color: #fff;
  }
  .btn.ok {
    background: linear-gradient(135deg, #17915c 0%, var(--ok) 100%);
    border-color: transparent; color: #04231a;
  }
  .btn.danger {
    background: #3a1420; border-color: #6b2033; color: #ff8098;
  }
  .btn.on {
    background: linear-gradient(135deg, #17915c 0%, var(--ok) 100%);
    border-color: transparent; color: #04231a;
  }
  .label {
    font-size: 12px; color: var(--dim); margin: 2px 0 8px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .label b { color: var(--acc2); font-size: 15px; font-weight: 700; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 34px; background: transparent; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 10px; border-radius: 6px;
    background: linear-gradient(90deg, var(--acc) 0%, var(--acc2) var(--pct, 0%), #2a3242 var(--pct, 0%), #2a3242 100%);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 26px; height: 26px; border-radius: 50%;
    background: #fff; border: 3px solid var(--acc);
    margin-top: -8px;
    box-shadow: 0 2px 10px rgba(255,59,107,.5);
  }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip {
    flex: 1 1 0; min-width: 0;
    padding: 11px 4px; text-align: center;
    border-radius: 11px; border: 1px solid var(--line);
    background: #1f2634; color: var(--txt);
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .chip.on { background: linear-gradient(135deg, var(--acc), var(--acc2)); border-color: transparent; color: #fff; }
  .grid8 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .grid8 .chip { padding: 14px 4px; font-size: 16px; }
  .k { font-size: 12px; color: var(--dim); margin-bottom: 7px; }
  details {
    background: #0d1016; border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 12px;
  }
  details summary {
    font-size: 13px; color: var(--dim); cursor: pointer; outline: none;
  }
  #log {
    margin-top: 8px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.65;
    color: #9fb0c9;
    max-height: 200px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all;
  }
  #log .hi { color: var(--ok); }
  #log .er { color: #ff7a8f; }
  .stat {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--dim); margin-top: 10px;
  }
  .stat span b { color: var(--txt); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #4a5568; margin-right: 5px; }
  .dot.live { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .timer {
    font-size: 12px; color: var(--warn); text-align: center;
    margin-top: 8px; min-height: 16px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SVAKOM SL278H 控制台</h1>
  <div class="sub">真协议 7 字节 · 无 CRC · FFE0/FFE1</div>

  <div class="card">
    <div class="row">
      <button class="btn primary" id="btnConnect">连接设备</button>
      <button class="btn" id="btnDisconnect" disabled>断开</button>
    </div>
    <div class="stat">
      <span><i class="dot" id="dot"></i><b id="devName">未连接</b></span>
      <span id="keepAliveInfo"></span>
    </div>
  </div>

  <div class="card">
    <div class="label">强度 <b id="valTxt">0%</b></div>
    <input type="range" id="speed" min="0" max="100" value="0" step="1" style="--pct:0%">
    <div class="chips" style="margin-top:10px">
      <button class="chip" data-v="15">15%</button>
      <button class="chip" data-v="30">30%</button>
      <button class="chip" data-v="50">50%</button>
      <button class="chip" data-v="70">70%</button>
      <button class="chip" data-v="100">满</button>
    </div>
  </div>

  <div class="card">
    <div class="k">花样模式（1–8，可叠加等级）</div>
    <div class="grid8" id="patterns"></div>
    <div class="k" style="margin-top:12px">花样等级</div>
    <div class="chips" id="levels">
      <button class="chip" data-l="1">1</button>
      <button class="chip" data-l="2">2</button>
      <button class="chip" data-l="3">3</button>
      <button class="chip" data-l="4">4</button>
      <button class="chip" data-l="5">5</button>
    </div>
  </div>

  <div class="card">
    <div class="k">自动巡航</div>
    <div class="chips">
      <button class="chip" data-c="wave">波浪</button>
      <button class="chip" data-c="rise">渐强</button>
      <button class="chip" data-c="pulse">脉冲</button>
      <button class="chip" data-c="off">关闭</button>
    </div>
  </div>

  <div class="card">
    <div class="k">定时运行</div>
    <div class="chips">
      <button class="chip" data-t="60">1 分钟</button>
      <button class="chip" data-t="300">5 分钟</button>
      <button class="chip" data-t="600">10 分钟</button>
      <button class="chip" data-t="0">不限时</button>
    </div>
    <div class="timer" id="timerText"></div>
  </div>

  <div class="card">
    <button class="btn danger" id="btnStop" style="width:100%">■ 紧急停止</button>
  </div>

  <details>
    <summary>运行日志（点开查看）</summary>
    <div id="log"></div>
  </details>

  <div class="sub" style="text-align:center">
    仅供已授权设备使用 · 不要在公共场合误触
  </div>
</div>

<script>
/* ============ 协议常量（来自 svakom-ble-ai / bridge.py，真机已验证） ============ */
const SVC        = 0xFFE0;
const CHR_WRITE  = 0xFFE1;   // write / writeWithoutResponse
const CHR_NOTIFY = 0xFFE2;
const KEEPALIVE_MS = 1500;

// 强度： [55, 04, 00, 00, 01, v, AA]
const cmdScale = (v) => [0x55, 0x04, 0x00, 0x00, 0x01, (v & 0xFF), 0xAA];
// 停止： [55, 04, 00, 00, 00, 00, AA]
const cmdScaleStop = () => [0x55, 0x04, 0x00, 0x00, 0x00, 0x00, 0xAA];
// 花样： [55, 03, 00, 00, mode, level, 00]
const cmdVibrate = (mode, level) => [0x55, 0x03, 0x00, 0x00, (mode & 0xFF), (level & 0xFF), 0x00];

/* ============ 状态 ============ */
let device = null, server = null, chrWrite = null, chrNotify = null;
let currentCmd = null;      // 需要续命的包
let keepTimer = null;
let cruiseTimer = null, cruiseMode = null, cruiseT = 0;
let durationTimer = null, durEnd = 0;
let lastWrittenAt = 0;

const $ = (id) => document.getElementById(id);
const logBox = $('log');

function log(msg, cls) {
  const t = new Date().toTimeString().slice(0, 8);
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = `[${t}] ${msg}`;
  logBox.appendChild(line);
  while (logBox.childNodes.length > 40) logBox.removeChild(logBox.firstChild);
  logBox.scrollTop = logBox.scrollHeight;
}
const hex = (arr) => arr.map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

/* ============ 蓝牙连接 ============ */
async function connect() {
  if (!navigator.bluetooth) {
    log('此浏览器不支持 Web Bluetooth。请用 Android Chrome / Edge。', 'er');
    alert('此浏览器不支持 Web Bluetooth。\n请用 Android Chrome / Edge 打开。');
    return;
  }
  try {
    log('正在扫描设备…');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'SL' }, { namePrefix: 'SVAKOM' }, { namePrefix: 'SV' }],
      optionalServices: [SVC, 0xFFF0]   // 不声明 AE00：OTA 刷机口永不触碰
    });
    device.addEventListener('gattserverdisconnected', onDisconnect);
    log(`设备: ${device.name || '(无名)'} · ${device.id.slice(0, 8)}`);

    server = await device.gatt.connect();
    log('GATT 已连接，获取服务…');

    const svc = await server.getPrimaryService(SVC);
    chrWrite = await svc.getCharacteristic(CHR_WRITE);
    try { chrNotify = await svc.getCharacteristic(CHR_NOTIFY); } catch (e) { chrNotify = null; }

    const p = chrWrite.properties;
    log(`FFE1 属性: write=${!!p.write} noResp=${!!p.writeWithoutResponse}`, 'hi');

    $('btnConnect').disabled = true;
    $('btnDisconnect').disabled = false;
    $('devName').textContent = device.name || 'SL278H';
    $('dot').classList.add('live');
    log('已连接 · FFE0/FFE1 就绪', 'hi');

    // 首包：发一次 0 强度，确认通道
    await write(cmdScale(0));
  } catch (e) {
    log('连接失败: ' + (e.message || e), 'er');
    console.error(e);
  }
}

function onDisconnect() {
  stopAllTimers();
  $('btnConnect').disabled = false;
  $('btnDisconnect').disabled = true;
  $('devName').textContent = '已断开';
  $('dot').classList.remove('live');
  log('设备已断开', 'er');
}

async function disconnect() {
  stopAllTimers();
  try { if (device && device.gatt.connected) device.gatt.disconnect(); } catch (e) {}
}

/* ============ 写入 ============ */
async function write(cmd) {
  if (!chrWrite) return;
  const data = new Uint8Array(cmd);
  try {
    if (chrWrite.properties.writeWithoutResponse) {
      await chrWrite.writeValueWithoutResponse(data);
    } else {
      await chrWrite.writeValue(data);
    }
    lastWrittenAt = Date.now();
  } catch (e) {
    try { await chrWrite.writeValue(data); lastWrittenAt = Date.now(); }
    catch (e2) { log('写入失败: ' + (e2.message || e2), 'er'); }
  }
}

/* ============ 续命 ============ */
function setKeepAlive() {
  clearInterval(keepTimer);
  if (!currentCmd) return;
  keepTimer = setInterval(() => {
    if (!chrWrite) return;
    write(currentCmd);
  }, KEEPALIVE_MS);
  $('keepAliveInfo').textContent = `续命 ${KEEPALIVE_MS}ms`;
}

function clearKeepAlive() {
  clearInterval(keepTimer);
  keepTimer = null;
  $('keepAliveInfo').textContent = '';
}

/* ============ 强度 ============ */
function setSpeed(pct) {
  pct = Math.max(0, Math.min(100, Math.round(pct)));
  $('speed').value = pct;
  $('speed').style.setProperty('--pct', pct + '%');
  $('valTxt').textContent = pct + '%';

  if (pct === 0) {
    currentCmd = cmdScaleStop();
    write(currentCmd);
    clearKeepAlive();
    log('强度 0%（停止）');
    return;
  }
  const v = Math.round(pct * 255 / 100);
  currentCmd = cmdScale(v);
  write(currentCmd);
  setKeepAlive();
  log(`📳 强度 ${pct}% → ${hex(currentCmd)}`);
}

/* ============ 花样 ============ */
function setPattern(mode, level) {
  const cmd = cmdVibrate(mode, level);
  currentCmd = cmd;
  write(cmd);
  setKeepAlive();
  log(`🎛 花样 ${mode} · 等级 ${level} → ${hex(cmd)}`);
}

/* ============ 停止 ============ */
async function stop() {
  stopAllTimers();
  currentCmd = null;
  clearKeepAlive();
  $('valTxt').textContent = '0%';
  $('speed').value = 0;
  $('speed').style.setProperty('--pct', '0%');
  document.querySelectorAll('.chip.on').forEach(el => el.classList.remove('on'));

  // 连发 3 次，防止漏包
  for (let i = 0; i < 3; i++) {
    await write(cmdScaleStop());
    await sleep(60);
  }
  log('■ 已停止', 'hi');
}

function stopAllTimers() {
  clearInterval(keepTimer); keepTimer = null;
  clearInterval(cruiseTimer); cruiseTimer = null;
  cruiseMode = null;
  clearInterval(durationTimer); durationTimer = null;
  durEnd = 0;
  $('timerText').textContent = '';
  $('keepAliveInfo').textContent = '';
}

/* ============ 自动巡航 ============ */
function startCruise(mode) {
  clearInterval(cruiseTimer);
  cruiseTimer = null;
  cruiseMode = mode;
  cruiseT = 0;

  if (mode === 'off') {
    document.querySelectorAll('[data-c]').forEach(el => el.classList.remove('on'));
    log('巡航已关闭');
    return;
  }
  document.querySelectorAll('[data-c]').forEach(el => {
    el.classList.toggle('on', el.dataset.c === mode);
  });
  log('巡航启动: ' + ({ wave: '波浪', rise: '渐强', pulse: '脉冲' }[mode]));

  cruiseTimer = setInterval(() => {
    if (!chrWrite) return;
    cruiseT += 400;
    let pct;
    if (mode === 'wave') {
      pct = 50 + 45 * Math.sin(cruiseT / 2600);
    } else if (mode === 'rise') {
      const cyc = (cruiseT % 16000) / 16000;
      pct = 10 + cyc * 85;
    } else { // pulse
      const cyc = (cruiseT % 3200) / 3200;
      pct = cyc < 0.55 ? 85 : 8;
    }
    pct = Math.max(0, Math.min(100, Math.round(pct)));
    $('speed').value = pct;
    $('speed').style.setProperty('--pct', pct + '%');
    $('valTxt').textContent = pct + '%';
    const cmd = cmdScale(Math.round(pct * 255 / 100));
    currentCmd = cmd;
    write(cmd);
  }, 400);
}

/* ============ 定时运行 ============ */
function startDuration(sec) {
  clearInterval(durationTimer);
  durationTimer = null;

  document.querySelectorAll('[data-t]').forEach(el => {
    el.classList.toggle('on', Number(el.dataset.t) === sec);
  });

  if (!sec) {
    durEnd = 0;
    $('timerText').textContent = '不限时运行';
    log('定时: 不限时');
    return;
  }
  durEnd = Date.now() + sec * 1000;
  log(`定时: ${sec / 60} 分钟后自动停止`);

  const tick = () => {
    const left = durEnd - Date.now();
    if (left <= 0) {
      clearInterval(durationTimer);
      durationTimer = null;
      $('timerText').textContent = '已到时 · 自动停止';
      log('⏱ 到时，自动停止', 'hi');
      stop();
      return;
    }
    const m = Math.floor(left / 60000);
    const s = Math.floor((left % 60000) / 1000);
    $('timerText').textContent = `剩余 ${m}:${String(s).padStart(2, '0')}`;
  };
  tick();
  durationTimer = setInterval(tick, 1000);
}

/* ============ UI 绑定 ============ */
$('btnConnect').onclick = connect;
$('btnDisconnect').onclick = disconnect;
$('btnStop').onclick = stop;

$('speed').addEventListener('input', (e) => {
  const pct = Number(e.target.value);
  $('speed').style.setProperty('--pct', pct + '%');
  $('valTxt').textContent = pct + '%';
});
$('speed').addEventListener('change', (e) => {
  startCruise('off');           // 手动拖就退出巡航
  setSpeed(Number(e.target.value));
});

document.querySelectorAll('[data-v]').forEach(el => {
  el.onclick = () => {
    startCruise('off');
    document.querySelectorAll('[data-v]').forEach(x => x.classList.remove('on'));
    el.classList.add('on');
    setSpeed(Number(el.dataset.v));
  };
});

// 花样按钮
const patternBox = $('patterns');
for (let i = 1; i <= 8; i++) {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = i;
  b.dataset.p = i;
  patternBox.appendChild(b);
}
let curPattern = 1, curLevel = 3;
document.querySelectorAll('[data-p]').forEach(el => {
  el.onclick = () => {
    curPattern = Number(el.dataset.p);
    document.querySelectorAll('[data-p]').forEach(x => x.classList.remove('on'));
    el.classList.add('on');
    setPattern(curPattern, curLevel);
  };
});
document.querySelectorAll('[data-l]').forEach(el => {
  el.onclick = () => {
    curLevel = Number(el.dataset.l);
    document.querySelectorAll('[data-l]').forEach(x => x.classList.remove('on'));
    el.classList.add('on');
    if (currentCmd) setPattern(curPattern, curLevel);
  };
});
document.querySelector('[data-l="3"]').classList.add('on');

document.querySelectorAll('[data-c]').forEach(el => {
  el.onclick = () => startCruise(el.dataset.c);
});
document.querySelectorAll('[data-t]').forEach(el => {
  el.onclick = () => startDuration(Number(el.dataset.t));
});

// 切后台提示
document.addEventListener('visibilitychange', () => {
  if (document.hidden && currentCmd) {
    log('⚠ 页面切到后台，浏览器可能暂停续命，切回前台会自动恢复', 'er');
  }
});
window.addEventListener('beforeunload', () => { stopAllTimers(); });

log('页面就绪 · 协议已载入（SL278H / 7字节 / 无CRC）', 'hi');
</script>
</body>
</html>
